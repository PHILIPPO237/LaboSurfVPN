<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revendeur | Ma bannière</title>
    <link rel="stylesheet" href="/static/css/tailwind-build.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/panel-accent.css">
    <script defer src="/static/js/panel-accent.js"></script>
    <style>
        :root {
            --dark: #050505;
            --cyan: #00f2ff;
            --orange: #ff8f00;
            --yellow: #facc15;
            --green: #39ff14;
            --danger: #ef4444;
        }
        body {
            background:
                radial-gradient(circle at 15% 10%, rgba(0, 242, 255, 0.12), transparent 34%),
                radial-gradient(circle at 85% 24%, rgba(250, 204, 21, 0.12), transparent 38%),
                radial-gradient(circle at 50% 92%, rgba(57, 255, 20, 0.08), transparent 42%),
                var(--dark);
            color: #e6faf7;
            min-height: 100vh;
        }
        .glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(0); }
        .field { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.14); color: #e6faf7; }
        .field:focus { outline: none; border-color: rgba(var(--panel-accent-rgb,0,242,255),0.6); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .menu-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
        .menu-pill:hover { background: rgba(255,255,255,0.1); }
        .preview-banner {
            border: 1px solid rgba(var(--panel-accent-rgb,0,242,255),0.4);
            background: rgba(var(--panel-accent-rgb,0,242,255),0.08);
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="max-w-2xl mx-auto px-4 py-8">
        <header>
            <div class="flex items-center justify-between gap-4 flex-wrap">
                <div>
                    <div class="orbitron text-xs tracking-[0.25em] uppercase" style="color:rgb(var(--panel-accent-rgb,0,242,255));">Revendeur</div>
                    <h1 class="orbitron text-xl md:text-2xl font-bold mt-1">Ma bannière</h1>
                    <p class="mono text-xs text-gray-400 mt-2 max-w-md">
                        Personnalise la bannière que VOS clients voient dans l'app Labo Surf.
                        Tant que tu n'as rien défini ici, ils voient la bannière par défaut.
                    </p>
                </div>
                <button onclick="location.href='/panel-revendeur'"
                    class="menu-pill h-11 px-5 rounded-xl mono text-[11px] font-bold uppercase tracking-wider">
                    <i class="fas fa-arrow-left mr-2"></i> Retour au panel
                </button>
            </div>
        </header>

        <section class="glass rounded-[1.6rem] p-6 md:p-8 mt-6">
            <div id="accessWarning" class="hidden mb-5 rounded-xl border border-red-400/40 bg-red-500/10 p-4">
                <p class="mono text-xs text-red-200">Impossible de charger ta bannière pour l'instant.</p>
            </div>

            <!-- Aperçu en direct -->
            <div class="preview-banner p-4 mb-6">
                <div class="mono text-[10px] uppercase tracking-widest text-gray-400 mb-2">Aperçu</div>
                <div id="previewText" class="orbitron text-sm font-bold" style="color:rgb(var(--panel-accent-rgb,0,242,255));">
                    Ta bannière apparaîtra ici
                </div>
            </div>

            <form id="bannerForm" class="space-y-5">
                <div>
                    <label for="bannerText" class="flex items-center gap-2 mb-2 text-sm font-semibold" style="color:rgb(var(--panel-accent-rgb,0,242,255));">
                        <i class="fas fa-bullhorn"></i> Texte de la bannière
                    </label>
                    <input id="bannerText" type="text" maxlength="120" autocomplete="off" placeholder="Ex: Bienvenue chez Paul VPN !"
                        class="field w-full rounded-xl px-4 py-3 mono text-sm">
                </div>

                <div>
                    <label for="bannerLink" class="flex items-center gap-2 mb-2 text-sm font-semibold text-yellow-200">
                        <i class="fas fa-link"></i> Lien (ton canal Telegram, par exemple)
                    </label>
                    <input id="bannerLink" type="text" autocomplete="off" placeholder="https://t.me/mon_canal"
                        class="field w-full rounded-xl px-4 py-3 mono text-sm">
                </div>

                <div>
                    <label for="bannerColor" class="flex items-center gap-2 mb-2 text-sm font-semibold text-gray-300">
                        <i class="fas fa-palette"></i> Couleur
                    </label>
                    <input id="bannerColor" type="color" value="#39ff14"
                        class="field w-20 h-11 rounded-xl px-2 py-1">
                </div>

                <div class="flex flex-col md:flex-row md:items-center gap-3 pt-1">
                    <button id="saveBtn" type="submit"
                        class="h-11 px-6 rounded-xl border transition orbitron text-xs font-bold tracking-[0.2em] uppercase"
                        style="background:rgba(var(--panel-accent-rgb,0,242,255),0.2);border-color:rgba(var(--panel-accent-rgb,0,242,255),0.4);">
                        Enregistrer
                    </button>
                    <button id="reloadBtn" type="button"
                        class="h-11 px-6 rounded-xl bg-white/5 border border-white/15 hover:bg-white/10 transition mono text-xs font-bold uppercase tracking-wider">
                        Recharger
                    </button>
                </div>
                <p id="formMsg" class="mono text-xs mt-2"></p>
            </form>
        </section>
    </div>

    <script>
        const textEl = document.getElementById('bannerText');
        const linkEl = document.getElementById('bannerLink');
        const colorEl = document.getElementById('bannerColor');
        const previewEl = document.getElementById('previewText');
        const msgEl = document.getElementById('formMsg');
        const warningEl = document.getElementById('accessWarning');

        function updatePreview() {
            previewEl.textContent = textEl.value.trim() || 'Ta bannière apparaîtra ici';
            previewEl.style.color = colorEl.value;
        }
        textEl.addEventListener('input', updatePreview);
        colorEl.addEventListener('input', updatePreview);

        async function loadBanner() {
            try {
                const res = await fetch('/api/revendeur/banner');
                const data = await res.json();
                if (data.status === 'ok' && data.banner) {
                    textEl.value = data.banner.text || '';
                    linkEl.value = data.banner.link || '';
                    colorEl.value = data.banner.color || '#39ff14';
                }
                updatePreview();
            } catch (e) {
                warningEl.classList.remove('hidden');
            }
        }

        document.getElementById('bannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            msgEl.textContent = '';
            if (!textEl.value.trim()) {
                msgEl.textContent = 'Le texte est obligatoire.';
                msgEl.style.color = '#ef4444';
                return;
            }
            try {
                const res = await fetch('/api/revendeur/banner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: textEl.value.trim(),
                        link: linkEl.value.trim(),
                        color: colorEl.value,
                    }),
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    msgEl.textContent = 'Bannière enregistrée. Tes clients la verront dès leur prochaine connexion.';
                    msgEl.style.color = '#39ff14';
                } else {
                    msgEl.textContent = data.message || 'Erreur lors de la sauvegarde.';
                    msgEl.style.color = '#ef4444';
                }
            } catch (e) {
                msgEl.textContent = 'Connexion au panel impossible.';
                msgEl.style.color = '#ef4444';
            }
        });

        document.getElementById('reloadBtn').addEventListener('click', loadBanner);
        loadBanner();
    </script>
</body>
</html>
