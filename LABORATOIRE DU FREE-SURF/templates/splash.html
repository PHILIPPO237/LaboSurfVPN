<!DOCTYPE html>

<html lang="fr">

<head>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratoire du Free-Surf</title>

    <link rel="stylesheet" href="/static/fonts/fonts.css">

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            width: 100vw;

            height: 100vh;

            background: linear-gradient(135deg, #050505 0%, #0a0f1a 50%, #050505 100%);

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: 'JetBrains Mono', monospace;

            overflow: hidden;

            position: fixed;

        }



        /* === ANIMATED BACKGROUND === */

        .bg-animate {

            position: absolute;

            width: 100%;

            height: 100%;

            top: 0;

            left: 0;

            z-index: 0;

        }



        .bg-grad-1 {

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            background: radial-gradient(circle, rgba(0, 242, 255, 0.15) 0%, transparent 70%);

            top: -100px;

            right: -100px;

            animation: float1 12s ease-in-out infinite;

        }



        .bg-grad-2 {

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            background: radial-gradient(circle, rgba(239, 68, 68, 0.12) 0%, transparent 70%);

            bottom: -150px;

            left: -100px;

            animation: float2 15s ease-in-out infinite;

        }



        .bg-grad-3 {

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background: radial-gradient(circle, rgba(57, 255, 20, 0.08) 0%, transparent 70%);

            top: 50%;

            left: 10%;

            animation: float3 18s ease-in-out infinite;

        }



        @keyframes float1 {

            0%, 100% { transform: translate(0, 0); }

            50% { transform: translate(-50px, 50px); }

        }



        @keyframes float2 {

            0%, 100% { transform: translate(0, 0); }

            50% { transform: translate(50px, -50px); }

        }



        @keyframes float3 {

            0%, 100% { transform: translate(0, 0); }

            50% { transform: translate(30px, 30px); }

        }



        /* === CONTENT === */

        .splash-container {

            position: relative;

            z-index: 10;

            text-align: center;

            animation: fadeIn 0.8s ease-out;

        }



        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        .logo-wrapper {

            margin-bottom: 2rem;

            animation: logoScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;

        }



        @keyframes logoScale {

            from {

                opacity: 0;

                transform: scale(0.5);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }



        .logo {

            width: 120px;

            height: 120px;

            margin: 0 auto;

            background: linear-gradient(135deg, #00f2ff 0%, #00d4ff 100%);

            border-radius: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 60px;

            font-weight: 900;

            color: #050505;

            box-shadow: 

                0 0 40px rgba(0, 242, 255, 0.4),

                inset 0 0 20px rgba(255, 255, 255, 0.2);

            position: relative;

            overflow: hidden;

        }



        .logo::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 1px;

            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);

        }



        .app-name {

            font-family: 'Orbitron', sans-serif;

            font-size: 28px;

            font-weight: 900;

            color: #fff;

            letter-spacing: 0.15em;

            text-transform: uppercase;

            margin-bottom: 0.5rem;

            animation: slideUp 0.8s ease-out 0.4s backwards;

        }



        .app-tagline {

            font-size: 12px;

            color: rgba(255, 255, 255, 0.6);

            text-transform: uppercase;

            letter-spacing: 0.12em;

            margin-bottom: 3rem;

            animation: slideUp 0.8s ease-out 0.6s backwards;

        }



        @keyframes slideUp {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }



        /* === LOADING === */

        .loading-bar {

            width: 120px;

            height: 3px;

            background: rgba(255, 255, 255, 0.1);

            border-radius: 10px;

            margin: 0 auto;

            overflow: hidden;

            animation: slideUp 0.8s ease-out 0.8s backwards;

        }



        .loading-bar::after {

            content: '';

            display: block;

            width: 30%;

            height: 100%;

            background: linear-gradient(90deg, transparent, #00f2ff, transparent);

            animation: progress 2s ease-in-out infinite;

        }



        @keyframes progress {

            0% { transform: translateX(-100%); }

            50% { transform: translateX(400%); }

            100% { transform: translateX(500%); }

        }



        /* === PARTICLES === */

        .particle {

            position: absolute;

            width: 2px;

            height: 2px;

            border-radius: 50%;

            background: rgba(0, 242, 255, 0.3);

            z-index: 5;

        }



        /* === MOBILE OPTIMIZED === */

        @media (max-width: 768px) {

            .logo {

                width: 100px;

                height: 100px;

                font-size: 50px;

            }



            .app-name {

                font-size: 24px;

            }



            body {

                background: linear-gradient(135deg, #050505 0%, #0a0f1a 50%, #050505 100%);

            }

        }



        /* === ACCESSIBILITY === */

        @media (prefers-reduced-motion: reduce) {

            * {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

            }

        }

    </style>

</head>

<body>
    <div style="position: fixed; top: 20px; left: 20px; right: 20px; z-index: 20; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px;">Retour a l'accueil</a>
        <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px;">Menu principal</a>
    </div>

    <!-- Animated Background -->

    <div class="bg-animate">

        <div class="bg-grad-1"></div>

        <div class="bg-grad-2"></div>

        <div class="bg-grad-3"></div>

    </div>



    <!-- Main Content -->

    <div class="splash-container">

        <div class="logo-wrapper">

            <div class="logo">

                <span>⚡</span>

            </div>

        </div>

        <h1 class="app-name">Laboratoire</h1>

        <p class="app-tagline">Du Free-Surf</p>

        <div class="loading-bar"></div>

    </div>



    <script>

        // Auto-redirect after 2.5 seconds

        setTimeout(() => {

            window.location.href = '/';

        }, 2500);



        // Alternative: If coming from login, go to onboarding

        const referrer = document.referrer;

        if (referrer && referrer.includes('/acces')) {

            setTimeout(() => {

                window.location.href = '/onboarding';

            }, 2500);

        }



        // Generate particles

        function createParticles() {

            const container = document.body;

            for (let i = 0; i < 15; i++) {

                const particle = document.createElement('div');

                particle.className = 'particle';

                particle.style.left = Math.random() * 100 + '%';

                particle.style.top = Math.random() * 100 + '%';

                particle.style.animation = `float${Math.floor(Math.random() * 3) + 1} ${10 + Math.random() * 10}s ease-in-out infinite`;

                container.appendChild(particle);

            }

        }



        createParticles();

    </script>

</body>

</html>
