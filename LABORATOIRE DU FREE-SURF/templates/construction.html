<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">
    <title>LABORATOIRE | Travaux en cours</title>
    <link rel="stylesheet" href="/static/css/tailwind-build.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/command-palette.css">
    <link rel="stylesheet" href="/static/css/a11y.css">
    <script defer src="/static/js/command-palette.js"></script>
    <style>
        :root { --warn: #ffd700; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Animation de la barrière de chantier */
        .hazard-bar {
            background: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #000 20px, #000 40px);
            height: 10px; width: 100%; position: absolute; left: 0;
        }
        .top-bar { top: 0; }
        .bottom-bar { bottom: 0; }

        .construction-box {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 40px; border-radius: 40px;
            text-align: center; max-width: 500px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .crane-icon { animation: swing 3s ease-in-out infinite; display: inline-block; }
        @keyframes swing { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

        .progress-container { background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .progress-fill { 
            background: var(--warn); height: 100%; width: 65%; 
            box-shadow: 0 0 15px var(--warn);
            animation: grow 2s infinite alternate; 
        }
        @keyframes grow { from { opacity: 0.5; width: 60%; } to { opacity: 1; width: 75%; } }
    </style>
  <script defer src="/static/js/ui-a11y.js"></script>
</head>
<body>
    <!-- audit-nav -->
    <div data-nav-audit="generic" class="flex flex-wrap items-center gap-3 mb-6 text-[11px] uppercase tracking-widest">
      <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-arrow-left"></i> Retour a l'accueil
      </a>
      <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-bars"></i> Menu
      </a>
    </div>

    <div class="hazard-bar top-bar"></div>

    <div class="construction-box">
        <div class="crane-icon text-5xl text-[#ffd700] mb-6">
            <i class="fas fa-helmet-safety"></i>
        </div>
        
        <h1 class="orbitron text-2xl font-black mb-4 uppercase tracking-tighter text-[#ffd700]">
            Accès Restreint
        </h1>
        
        <p class="text-xs text-gray-400 leading-relaxed mb-6">
            Les ingénieurs du <span class="text-white font-bold">Philippo Laboratory</span> sont actuellement en train de configurer ce module. 
            <br><br>
            <span class="italic text-[10px]">L'optimisation de la plateforme est en cours pour garantir une stabilité maximale.</span>
        </p>

        <div class="text-[10px] orbitron text-gray-500 mb-2 uppercase tracking-widest">
            Progression du déploiement
        </div>
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>

        <button onclick="location.href='/dashboard'" class="mt-10 px-8 py-3 bg-white/5 border border-white/10 rounded-full text-[10px] orbitron font-bold hover:bg-[#ffd700] hover:text-black transition-all">
            🏠 RETOUR AU HUB
        </button>
    </div>

    <div class="hazard-bar bottom-bar"></div>

    <!-- Petites étincelles décoratives -->
    <div class="absolute top-1/4 left-1/4 w-1 h-1 bg-[#ffd700] rounded-full animate-ping"></div>
    <div class="absolute bottom-1/3 right-1/4 w-1 h-1 bg-[#ffd700] rounded-full animate-ping" style="animation-delay: 1s"></div>

</body>
</html>
