<!DOCTYPE html>

<html lang="fr">

<head>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Définir un mot de passe | LABORATOIRE</title>

    <link rel="stylesheet" href="/static/css/tailwind-build.css">

    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">

    <link rel="stylesheet" href="/static/fonts/fonts.css">

  <link rel="stylesheet" href="/static/css/command-palette.css">

  <link rel="stylesheet" href="/static/css/a11y.css">

  <script defer src="/static/js/command-palette.js"></script>

  <script defer src="/static/js/ui-a11y.js"></script>

  <style>

    body {

      background:

        radial-gradient(circle at 20% 10%, rgba(57,255,20,0.09), transparent 32%),

        radial-gradient(circle at 80% 20%, rgba(0,232,255,0.09), transparent 38%),

        linear-gradient(180deg, #050505 0%, #0a1111 100%);

    }

    .orbitron { font-family: "Orbitron", sans-serif; }

    .mono { font-family: "JetBrains Mono", monospace; }

    .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(14px); }

    input { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.16); }

    input:focus { outline: none; border-color: rgba(57,255,20,0.75); box-shadow: 0 0 0 4px rgba(57,255,20,0.12); }

    .password-field { position: relative; }

    .password-field input { padding-right: 3rem; }

    .password-toggle {

      position: absolute;

      top: 50%;

      right: 0.85rem;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: rgba(255,255,255,0.6);

      cursor: pointer;

    }

    .password-toggle:hover,

    .password-toggle:focus-visible { color: rgba(255,255,255,0.95); outline: none; }

  </style>

</head>

<body class="min-h-screen text-white p-5 md:p-8">

  <main class="mx-auto w-full max-w-2xl">
    <div class="flex flex-wrap items-center gap-3 mb-5 mono text-[11px] uppercase tracking-widest">
      <a href="/acces/mot-de-passe-oublie" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-arrow-left"></i> Retour
      </a>
      <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-house"></i> Accueil
      </a>
    </div>

    <section class="glass rounded-3xl p-6 md:p-8">

      <div class="mb-6">

        <p class="mono text-[10px] uppercase tracking-[0.35em] text-gray-300 mb-2">Réinitialisation sécurisée</p>

        <h1 class="orbitron text-2xl md:text-3xl font-black uppercase tracking-wider">Définir un nouveau mot de passe</h1>

        <p class="mono text-[12px] text-gray-300 mt-3">Choisis un nouveau mot de passe. Cette page reste disponible uniquement juste après la vérification de récupération.</p>

      </div>



      <div id="alert" class="hidden mb-5 rounded-2xl border p-4 border-red-500/40 bg-red-500/10">

        <div class="flex items-start gap-3">

          <i class="fas fa-triangle-exclamation mt-1 text-red-300"></i>

          <div>

            <p id="alertTitle" class="mono text-[11px] font-bold uppercase tracking-widest">Erreur</p>

            <p id="alertText" class="mono text-[12px] text-gray-100 mt-1"></p>

          </div>

        </div>

      </div>



      <form action="/acces/definir-mot-de-passe" method="POST" class="space-y-4">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <div>

          <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Nouveau mot de passe</label>

                    <div class="password-field">

            <input type="password" name="password" minlength="8" required autocomplete="new-password" class="w-full rounded-2xl px-4 py-3 mono text-[12px]" />

            <button type="button" class="password-toggle" data-password-toggle aria-label="Afficher le mot de passe" aria-pressed="false">

              <i class="fas fa-eye" aria-hidden="true"></i>

            </button>

          </div>

        </div>

        <div>

          <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Confirmer le mot de passe</label>

                    <div class="password-field">

            <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password" class="w-full rounded-2xl px-4 py-3 mono text-[12px]" />

            <button type="button" class="password-toggle" data-password-toggle aria-label="Afficher la confirmation du mot de passe" aria-pressed="false">

              <i class="fas fa-eye" aria-hidden="true"></i>

            </button>

          </div>

        </div>

        <button type="submit" class="w-full md:w-auto px-7 py-3 rounded-2xl bg-[#39ff14] text-black orbitron text-[11px] tracking-widest font-black uppercase hover:scale-[1.01] transition shadow-[0_0_22px_rgba(57,255,20,0.30)]">

          Enregistrer le nouveau mot de passe

        </button>

      </form>

    </section>

  </main>



  <script>

    (function () {

      document.querySelectorAll("[data-password-toggle]").forEach((button) => {

        const field = button.closest(".password-field");

        const input = field ? field.querySelector("input") : null;

        const icon = button.querySelector("i");

        if (!input || !icon) return;

        button.addEventListener("click", function () {

          const isHidden = input.type === "password";

          input.type = isHidden ? "text" : "password";

          button.setAttribute("aria-pressed", isHidden ? "true" : "false");

          button.setAttribute("aria-label", isHidden ? "Masquer le champ" : "Afficher le champ");

          icon.className = isHidden ? "fas fa-eye-slash" : "fas fa-eye";

        });

      });



      const err = (new URLSearchParams(window.location.search).get("err") || "").trim().toLowerCase();

      const box = document.getElementById("alert");

      const title = document.getElementById("alertTitle");

      const text = document.getElementById("alertText");

      if (!err || !box || !title || !text) return;

      box.classList.remove("hidden");

      if (err === "mismatch") {

        title.textContent = "Validation impossible";

        text.textContent = "Les mots de passe doivent être identiques et comporter au moins 8 caractères.";

      } else if (err === "weak_password") {

        title.textContent = "Mot de passe trop faible";

        text.textContent = "Utilisez au moins 8 caractères et évitez les mots de passe évidents (123456, azerty, votre pseudo...).";

      } else if (err === "csrf") {

        title.textContent = "Session expirée";

        text.textContent = "Recharge la page puis recommence.";

      } else {

        title.textContent = "Erreur";

        text.textContent = "Impossible d'enregistrer le nouveau mot de passe.";

      }

    })();

  </script>

</body>

</html>
