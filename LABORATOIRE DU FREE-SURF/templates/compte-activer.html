<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activer une Clé - Mon Compte</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/panel-professional.css">
    <link rel="stylesheet" href="/static/css/panel-accent.css">
    <script defer src="/static/js/panel-accent.js"></script>
    <style>
        body { font-family: "JetBrains Mono", monospace; background-color: #121212; color: #e0e0e0; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        header h1 { text-align: center; color: #4CAF50; }
        nav {
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            align-items: center;
        }
        nav a {
            color: #d8e5ef;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 11px;
            padding: 0.55rem 0.9rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(12px);
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease, color .2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 18px rgba(0, 0, 0, 0.22);
        }
        nav a:hover {
            color: #fff;
            border-color: rgba(var(--panel-accent-rgb, 0, 242, 255), 0.5);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(var(--panel-accent-rgb, 0, 242, 255), 0.08));
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 10px 22px rgba(0, 0, 0, 0.28), 0 0 18px rgba(var(--panel-accent-rgb, 0, 242, 255), 0.14);
        }
        nav a.active {
            color: #eafaff;
            border-color: rgba(var(--panel-accent-rgb, 0, 242, 255), 0.75);
            background: linear-gradient(135deg, rgba(var(--panel-accent-rgb, 0, 242, 255), 0.22), rgba(255, 255, 255, 0.08));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 22px rgba(var(--panel-accent-rgb, 0, 242, 255), 0.2), 0 10px 22px rgba(0, 0, 0, 0.3);
        }
        .form-container { background: #1e1e1e; padding: 30px; border-radius: 8px; }
        .form-container h2 { margin-top: 0; text-align: center; border-bottom: 1px solid #4CAF50; padding-bottom: 10px; }
        .form-group { margin-top: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 1.1em; }
        .form-group input { width: 100%; box-sizing: border-box; background: #333; border: 1px solid #555; color: #fff; padding: 12px; border-radius: 4px; font-size: 1.2em; text-align: center; text-transform: uppercase; }
        .btn { display: block; width: 100%; background-color: #4CAF50; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.2em; margin-top: 25px; }
        .btn:hover { background-color: #45a049; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        #form-feedback { font-weight: bold; text-align: center; margin-top: 20px; font-size: 1.1em; min-height: 25px; }
    </style>
  <link rel="stylesheet" href="/static/css/a11y.css">
  <script defer src="/static/js/ui-a11y.js"></script>
</head>
<body data-panel-key="free">
    <div class="container">
        <header>
            <h1>Mon Compte</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/profil">Mon Profil</a>
                <a href="/compte/activer" class="active">Activer une clé</a>
                <a href="/logout">Déconnexion</a>
            </nav>
        </header>

        <main>
    <!-- audit-nav -->
    <div data-nav-audit="subpage" class="flex flex-wrap items-center gap-3 mb-6 text-[11px] uppercase tracking-widest">
      <a href="/dashboard" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-arrow-left"></i> Retour au dashboard
      </a>
      <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-house"></i> Accueil
      </a>
    </div>
            <div class="form-container">
                <h2>Activer une Clé VIP</h2>
                <form id="activate-key-form" method="post">
                    <div class="form-group">
                        <label for="key">Veuillez saisir votre clé d'activation</label>
                        <input type="text" id="key" name="key" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                    </div>
                    <button type="submit" class="btn">Activer</button>
                </form>
                <div id="form-feedback"></div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('activate-key-form');
            const feedbackDiv = document.getElementById('form-feedback');
            const submitButton = form.querySelector('button');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                feedbackDiv.textContent = 'Vérification en cours...';
                feedbackDiv.style.color = '#fff';
                submitButton.disabled = true;
                submitButton.textContent = 'Activation...';

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch('/api/user/activate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.message || 'Une erreur est survenue.');
                    }

                    if (result.status === 'ok') {
                        feedbackDiv.textContent = result.message;
                        feedbackDiv.style.color = '#6bff6b';
                        form.querySelector('input').disabled = true;
                        submitButton.textContent = 'Succès !';
                        
                        // Redirect to login after a delay
                        setTimeout(() => {
                            window.location.href = '/acces?info=activation_success';
                        }, 4000);
                    } else {
                        throw new Error(result.message || "Erreur lors de l'activation.");
                    }
                } catch (error) {
                    feedbackDiv.textContent = `Erreur : ${error.message}`;
                    feedbackDiv.style.color = '#ff6b6b';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Activer';
                }
            });
        });
    </script>
</body>
</html>
