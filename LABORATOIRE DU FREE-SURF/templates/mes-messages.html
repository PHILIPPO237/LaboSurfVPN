<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes messages | {{USERNAME}}</title>
    <link rel="stylesheet" href="/static/css/tailwind-build.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/panel-accent.css">
    <script defer src="/static/js/panel-accent.js"></script>
    <style>
        :root { --dark: #050505; --cyan: #00f2ff; --green: #39ff14; }
        body {
            background: radial-gradient(circle at 20% 10%, rgba(0,242,255,0.10), transparent 36%), var(--dark);
            color: #e6faf7; min-height: 100vh;
        }
        .glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .menu-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
        .menu-pill:hover { background: rgba(255,255,255,0.1); }
        .msg-row { display: flex; margin-bottom: 12px; }
        .msg-row.mine { justify-content: flex-end; }
        .msg-bubble {
            max-width: 78%; border-radius: 1rem; padding: 10px 14px; font-size: 13px; line-height: 1.4;
        }
        .msg-row.mine .msg-bubble { background: rgba(0,242,255,0.14); border: 1px solid rgba(0,242,255,0.3); border-bottom-right-radius: 0.25rem; }
        .msg-row.theirs .msg-bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-bottom-left-radius: 0.25rem; }
        .msg-meta { font-size: 9.5px; color: #7c8f8a; margin-top: 4px; }
        .attachment-chip {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px;
            border-radius: 0.6rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
            font-size: 11px; text-decoration: none; color: #e6faf7;
        }
        #composerInput { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.14); color: #e6faf7; }
    </style>
</head>
<body>
    <div class="max-w-2xl mx-auto px-4 py-6 flex flex-col" style="height:100vh;">
        <header class="flex items-center justify-between gap-3 flex-wrap mb-4">
            <div>
                <div class="orbitron text-xs tracking-[0.25em] uppercase" style="color:rgb(var(--panel-accent-rgb,0,242,255));">Messagerie</div>
                <h1 class="orbitron text-lg font-bold mt-1">Mes messages</h1>
            </div>
            <button onclick="location.href='{{HOME_PANEL_URL}}'"
                class="menu-pill h-10 px-4 rounded-xl mono text-[11px] font-bold uppercase tracking-wider">
                <i class="fas fa-arrow-left mr-2"></i> Retour
            </button>
        </header>

        <div id="messagesList" class="glass rounded-[1.4rem] p-4 flex-1 overflow-y-auto mb-4" style="min-height:0;">
            <div id="emptyState" class="text-center py-10 mono text-xs text-gray-500">Chargement...</div>
        </div>

        <div class="glass rounded-[1.2rem] p-3">
            <div id="attachPreview" class="hidden mb-2 flex items-center gap-2 mono text-[11px] text-gray-300">
                <i class="fas fa-paperclip"></i> <span id="attachName"></span>
                <button onclick="clearAttachment()" class="text-red-300 ml-auto"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex items-end gap-2">
                <label class="menu-pill w-10 h-10 rounded-xl flex items-center justify-center cursor-pointer shrink-0" title="Joindre une capture de paiement">
                    <i class="fas fa-camera"></i>
                    <input type="file" id="attachInput" accept="image/*" class="hidden" onchange="onAttachmentChosen(event)">
                </label>
                <textarea id="composerInput" rows="1" placeholder="Écris un message..."
                    class="flex-1 rounded-xl px-3 py-2 mono text-sm" style="resize:none;"></textarea>
                <button id="sendBtn" onclick="sendMessage()"
                    class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                    style="background:rgba(var(--panel-accent-rgb,0,242,255),0.2);border:1px solid rgba(var(--panel-accent-rgb,0,242,255),0.4);">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <p class="mono text-[10px] text-gray-500 mt-2">
                <i class="fas fa-camera mr-1"></i> Utilise le trombone pour joindre une capture d'écran de ton paiement.
            </p>
        </div>
    </div>

    <script>
        let pendingAttachment = null; // { data: 'data:image/...', mime, filename }

        function onAttachmentChosen(ev){
            const file = ev.target.files[0];
            if(!file) return;
            if(file.size > 2_000_000){
                alert("Image trop volumineuse (2 Mo max).");
                ev.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                pendingAttachment = { data: reader.result, mime: file.type, filename: file.name };
                document.getElementById('attachName').textContent = file.name;
                document.getElementById('attachPreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        function clearAttachment(){
            pendingAttachment = null;
            document.getElementById('attachInput').value = '';
            document.getElementById('attachPreview').classList.add('hidden');
        }

        function renderMessages(messages){
            const list = document.getElementById('messagesList');
            if(!messages.length){
                list.innerHTML = '<div class="text-center py-10 mono text-xs text-gray-500">Aucun message pour l\'instant. Écris à ton administrateur ou ton revendeur ci-dessous.</div>';
                return;
            }
            list.innerHTML = messages.map(m => {
                const mine = m.sender_role === 'client';
                const roleLabel = m.sender_role === 'admin' ? 'Administrateur' : (m.sender_role === 'revendeur' ? 'Ton revendeur' : 'Toi');
                const date = new Date((m.created_at || 0) * 1000 || m.created_at);
                const timeStr = isNaN(date.getTime()) ? '' : date.toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
                let attachHtml = '';
                if(m.attachment_data){
                    if(m.message_type === 'invoice'){
                        attachHtml = `<a href="${m.attachment_data}" target="_blank" class="attachment-chip"><i class="fas fa-file-pdf"></i> ${m.attachment_filename || 'Facture.pdf'}</a>`;
                    } else if((m.attachment_mime || '').startsWith('image/') || (m.attachment_data || '').startsWith('data:image')){
                        attachHtml = `<div style="margin-top:8px;"><img src="${m.attachment_data}" style="max-width:100%; border-radius:0.6rem; border:1px solid rgba(255,255,255,0.15);"></div>`;
                    }
                }
                return `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
                    <div>
                        <div class="msg-bubble">
                            ${m.body ? m.body.replace(/</g,'&lt;') : ''}
                            ${attachHtml}
                        </div>
                        <div class="msg-meta" style="text-align:${mine ? 'right' : 'left'};">${roleLabel} · ${timeStr}</div>
                    </div>
                </div>`;
            }).join('');
            list.scrollTop = list.scrollHeight;
        }

        async function loadMessages(){
            try{
                const res = await fetch('/api/user/messages');
                const data = await res.json();
                renderMessages((data && data.messages) || []);
            }catch(e){
                document.getElementById('messagesList').innerHTML = '<div class="text-center py-10 mono text-xs text-red-300">Impossible de charger tes messages.</div>';
            }
        }

        async function sendMessage(){
            const input = document.getElementById('composerInput');
            const text = input.value.trim();
            if(!text && !pendingAttachment) return;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const payload = { body: text };
            if(pendingAttachment){
                payload.attachment_data = pendingAttachment.data;
                payload.attachment_mime = pendingAttachment.mime;
                payload.attachment_filename = pendingAttachment.filename;
                payload.message_type = 'payment_proof';
            }
            try{
                const res = await fetch('/api/user/messages', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if(data.status === 'ok'){
                    input.value = '';
                    clearAttachment();
                    await loadMessages();
                } else {
                    alert(data.message || "Impossible d'envoyer le message.");
                }
            }catch(e){
                alert("Connexion au panel impossible.");
            }finally{
                sendBtn.disabled = false;
            }
        }

        document.getElementById('composerInput').addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
        });

        loadMessages();
        setInterval(loadMessages, 15000); // rafraichissement discret, pas de websocket pour l'instant
    </script>
</body>
</html>
