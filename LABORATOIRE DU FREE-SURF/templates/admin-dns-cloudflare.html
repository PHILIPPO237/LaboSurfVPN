<html lang="fr">
<head>

  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">

  <style>
    :root { --accent: #00f2ff; --dark: #050505; --error: #ff4f4f; --warn: #ffc107; }

    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(0,242,255,0.10), transparent 42%),
        radial-gradient(circle at 80% 30%, rgba(57,255,20,0.07), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,15,15,0.05), transparent 55%),
        var(--dark);
      color: white;
      font-family: 'JetBrains Mono', monospace;
    }

    .orbitron { font-family: 'Orbitron', sans-serif; }
    .mono     { font-family: 'JetBrains Mono', monospace; }

    .glass {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(18px);
    }

    input, textarea {
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 10px;
      border-radius: 14px;
      outline: none;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus {
      border-color: rgba(0,242,255,0.75);
      box-shadow: 0 0 0 4px rgba(0,242,255,0.12);
    }
    /* État invalide */
    input.input-error {
      border-color: rgba(255,79,79,0.75);
      box-shadow: 0 0 0 4px rgba(255,79,79,0.12);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .6rem; padding: .85rem 1.05rem; border-radius: 18px;
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      letter-spacing: .18em; text-transform: uppercase; font-size: 11px;
      cursor: pointer; transition: filter .15s, opacity .15s, background .15s;
      border: none;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.07); }
    .btn-accent {
      background: var(--accent); color: #000;
      border: 1px solid rgba(0,242,255,0.35);
      box-shadow: 0 0 18px rgba(0,242,255,0.16);
    }
    .btn-accent:hover { filter: brightness(1.05); }

    /* Spinner inline dans le bouton */
    .btn .spinner {
      display: none;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .out {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; line-height: 1.45;
      background:
        radial-gradient(circle at 0% 0%, rgba(0,0,0,.62), transparent 62%),
        radial-gradient(circle at 100% 0%, rgba(0,0,0,.62), transparent 62%),
        radial-gradient(circle at 0% 100%, rgba(0,0,0,.62), transparent 62%),
        radial-gradient(circle at 100% 100%, rgba(0,0,0,.62), transparent 62%),
        radial-gradient(ellipse at center, rgba(0,242,255,.18) 0%, rgba(10,16,28,.94) 62%, rgba(5,5,5,.98) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 12px;
      white-space: pre-wrap; word-break: break-word;
      min-height: 92px;
      transition: border-color .2s;
    }
    /* Couleurs sémantiques dans le terminal */
    .out.out-error { border-color: rgba(255,79,79,0.4); color: #ff8f8f; }
    .out.out-warn  { border-color: rgba(255,193,7,0.4);  color: #ffd55a; }
    .out.out-ok    { border-color: rgba(0,242,255,0.35); color: #e0fffe; }

    /* Message d'erreur inline sous l'input */
    .field-msg {
      font-size: 10px; margin-top: 4px; min-height: 14px;
      color: var(--error); display: block;
      transition: opacity .2s;
    }
    .field-msg:empty { opacity: 0; }

    /* Toast copier */
    .copy-toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: rgba(0,242,255,0.15);
      border: 1px solid rgba(0,242,255,0.4);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: .6rem 1.1rem; border-radius: 12px;
      backdrop-filter: blur(12px);
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 9999;
    }
    .copy-toast.show { opacity: 1; transform: translateY(0); }
  </style>

<body class="theme-dns p-6 lg:p-10" data-page-guide="admin-dns-cloudflare">
    <!-- audit-nav -->
    <div data-nav-audit="admin" class="flex flex-wrap items-center gap-3 mb-6 text-[11px] uppercase tracking-widest">
      <a href="/admin" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-arrow-left"></i> Retour au dashboard admin
      </a>
      <a href="/admin" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-bars"></i> Menu admin
      </a>
    </div>

  <!-- Toast copier -->
  <div class="copy-toast" id="copyToast">✓ Copié</div>

  <div class="max-w-7xl mx-auto motion-page">

    <header class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6 mb-8 border-b border-white/10 pb-6">
      <div>
        <div class="flex items-center gap-2 mb-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-300" style="box-shadow:0 0 12px rgba(0,242,255,0.8)"></span>
          <span class="text-[10px] uppercase tracking-[0.35em] text-gray-300 mono">Admin tools</span>
        </div>
        <h1 class="orbitron text-2xl lg:text-3xl font-black tracking-widest uppercase">
          DNS <span class="text-cyan-200">Cloudflare</span>
        </h1>
        <p class="text-[11px] text-gray-400 mono mt-2">Resolve DNS — check Cloudflare CIDR statiques.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="location.href='/admin'" class="btn btn-ghost motion-press">
          <i class="fas fa-arrow-left"></i> Admin
        </button>
        <button onclick="location.href='/dashboard'" class="btn btn-ghost motion-press">
          <i class="fas fa-th-large"></i> Hub
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 motion-stagger">

      <!-- DNS Resolve -->
      <section class="glass rounded-2xl p-6 motion-lift" data-guide-id="dns">
        <h2 class="orbitron text-sm font-black tracking-widest uppercase text-cyan-200 mb-5">DNS Resolve</h2>
        <label for="dnsHost" class="block text-[10px] text-gray-400 uppercase tracking-widest mb-2">Domaine / Host</label>
        <input id="dnsHost" type="text" placeholder="Ex: m.orange.cm" autocomplete="off" aria-describedby="dnsHostMsg">
        <span class="field-msg" id="dnsHostMsg" role="alert"></span>
        <div class="mt-5 flex flex-wrap gap-2">
          <button id="dnsResolveBtn" class="btn btn-accent motion-press" type="button" aria-label="Résoudre le domaine">
            <span class="spinner"></span>
            <i class="fas fa-magnifying-glass btn-icon"></i>
            Résoudre
          </button>
          <button id="dnsCopyBtn" class="btn btn-ghost motion-press" type="button" aria-label="Copier le résultat">
            <i class="fas fa-copy"></i> Copier
          </button>
        </div>
        <div class="mt-4 out" id="dnsOut" role="status" aria-live="polite">Prêt.</div>
      </section>

      <!-- Cloudflare Check -->
      <section class="glass rounded-2xl p-6 motion-lift" data-guide-id="cf">
        <h2 class="orbitron text-sm font-black tracking-widest uppercase text-cyan-200 mb-5">Cloudflare Check</h2>
        <label for="cfValue" class="block text-[10px] text-gray-400 uppercase tracking-widest mb-2">IP ou domaine</label>
        <input id="cfValue" type="text" placeholder="Ex: 104.16.132.229 ou example.com" autocomplete="off" aria-describedby="cfValueMsg">
        <span class="field-msg" id="cfValueMsg" role="alert"></span>
        <div class="mt-5 flex flex-wrap gap-2">
          <button id="cfCheckBtn" class="btn btn-accent motion-press" type="button" aria-label="Vérifier Cloudflare">
            <span class="spinner"></span>
            <i class="fas fa-cloud btn-icon"></i>
            Vérifier
          </button>
          <button id="cfCopyBtn" class="btn btn-ghost motion-press" type="button" aria-label="Copier le résultat">
            <i class="fas fa-copy"></i> Copier
          </button>
        </div>
        <div class="mt-4 out" id="cfOut" role="status" aria-live="polite">Prêt.</div>
      </section>

    </div>
  </div>

  <script>
    // ─── Constantes ────────────────────────────────────────────────────────────
    const FETCH_TIMEOUT_MS = 8000;

    // ─── Validation ────────────────────────────────────────────────────────────
    const RE_IPV4   = /^(\d{1,3}\.){3}\d{1,3}$/;
    const RE_IPV6   = /^([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4}$/;
    const RE_DOMAIN = /^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;

    function isValidIpOrDomain(v) {
      return RE_IPV4.test(v) || RE_IPV6.test(v) || RE_DOMAIN.test(v);
    }
    function isValidDomain(v) {
      return RE_DOMAIN.test(v);
    }

    // ─── Toast copier ──────────────────────────────────────────────────────────
    function showCopyToast() {
      const toast = document.getElementById('copyToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ─── Clipboard (sans execCommand déprécié) ─────────────────────────────────
    async function copyToClipboard(text) {
      if (!text || text === 'Prêt.') return;
      try {
        await navigator.clipboard.writeText(text);
        showCopyToast();
      } catch {
        // Dernier recours : ouvrir un prompt pour copie manuelle
        window.prompt('Copier manuellement :', text);
      }
    }

    // ─── Fetch avec timeout via AbortController ────────────────────────────────
    async function fetchJSON(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
      try {
        const res  = await fetch(url, { signal: ctrl.signal });
        const data = await res.json().catch(() => null);
        clearTimeout(timer);
        return { ok: res.ok && data?.status !== 'error', data, timedOut: false };
      } catch (err) {
        clearTimeout(timer);
        return { ok: false, data: null, timedOut: err.name === 'AbortError' };
      }
    }

    // ─── Helpers UI ───────────────────────────────────────────────────────────
    function setOutState(outEl, text, state = 'ok') {
      outEl.textContent = text;
      outEl.className   = `mt-4 out out-${state}`;
    }

    function setFieldError(inputEl, msgEl, msg) {
      inputEl.classList.add('input-error');
      msgEl.textContent = msg;
    }
    function clearFieldError(inputEl, msgEl) {
      inputEl.classList.remove('input-error');
      msgEl.textContent = '';
    }

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.classList.toggle('loading', loading);
    }

    // ─── Factory générique ────────────────────────────────────────────────────
    function setupTool({ inputId, actionBtnId, copyBtnId, outId, msgId,
                          emptyMsg, invalidMsg, loadingMsg, errorMsg,
                          buildUrl, formatData, validate }) {
      const input     = document.getElementById(inputId);
      const actionBtn = document.getElementById(actionBtnId);
      const copyBtn   = document.getElementById(copyBtnId);
      const out       = document.getElementById(outId);
      const msgEl     = document.getElementById(msgId);

      async function run() {
        const value = input.value.trim();

        // Validation
        if (!value) {
          setFieldError(input, msgEl, emptyMsg);
          return;
        }
        if (validate && !validate(value)) {
          setFieldError(input, msgEl, invalidMsg);
          return;
        }
        clearFieldError(input, msgEl);

        setLoading(actionBtn, true);
        setOutState(out, loadingMsg, 'ok');

        const { ok, data, timedOut } = await fetchJSON(buildUrl(value));
        setLoading(actionBtn, false);

        if (timedOut) {
          setOutState(out, '⏱ Délai dépassé — le serveur ne répond pas (>8s).', 'warn');
          return;
        }
        if (!ok) {
          setOutState(out, errorMsg, 'error');
          return;
        }
        setOutState(out, formatData(data), 'ok');
      }

      actionBtn?.addEventListener('click', run);
      input?.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
      input?.addEventListener('input',   () => clearFieldError(input, msgEl));
      copyBtn?.addEventListener('click',  () => copyToClipboard(out.textContent.trim()));
    }

    // ─── DNS Resolve ──────────────────────────────────────────────────────────
    setupTool({
      inputId: 'dnsHost', actionBtnId: 'dnsResolveBtn',
      copyBtnId: 'dnsCopyBtn', outId: 'dnsOut', msgId: 'dnsHostMsg',
      emptyMsg:   'Saisis un domaine ou host.',
      invalidMsg: 'Format de domaine invalide.',
      loadingMsg: '⏳ Résolution en cours…',
      errorMsg:   '✗ Erreur réseau / serveur.',
      validate:   isValidDomain,
      buildUrl:   v => `/admin/dns/resolve?host=${encodeURIComponent(v)}`,
      formatData: d => [
        `HOST : ${d.host}`,
        `A    : ${d.a?.length    ? d.a.join(', ')    : 'none'}`,
        `AAAA : ${d.aaaa?.length ? d.aaaa.join(', ') : 'none'}`,
      ].join('\n'),
    });

    // ─── Cloudflare Check ────────────────────────────────────────────────────
    setupTool({
      inputId: 'cfValue', actionBtnId: 'cfCheckBtn',
      copyBtnId: 'cfCopyBtn', outId: 'cfOut', msgId: 'cfValueMsg',
      emptyMsg:   'Saisis une IP ou un domaine.',
      invalidMsg: 'Format IP (v4/v6) ou domaine invalide.',
      loadingMsg: '⏳ Vérification en cours…',
      errorMsg:   '✗ Erreur réseau / serveur.',
      validate:   isValidIpOrDomain,
      buildUrl:   v => `/admin/dns/check-cloudflare?value=${encodeURIComponent(v)}`,
      formatData: d => [
        `INPUT         : ${d.input}`,
        ...(d.kind ? [`TYPE          : ${d.kind}`] : []),
        '────────────────────────',
        ...(d.ips?.length
          ? d.ips.map(it => `${it.ip.padEnd(40)} ${it.iscloudflare ? '✓ CLOUDFLARE' : '✗ NO'}`)
          : ['Aucune IP.']),
        '────────────────────────',
        `ANY CLOUDFLARE : ${d.anycloudflare ? '\u2705 YES' : '\u274C NO'}`,
      ].join('\n'),
    });
  </script>
</body>
</html>
