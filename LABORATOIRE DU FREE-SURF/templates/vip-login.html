<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Login | LABORATOIRE</title>
    <link rel="stylesheet" href="/static/css/tailwind-build.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/command-palette.css">
  <link rel="stylesheet" href="/static/css/a11y.css">
  <script defer src="/static/js/command-palette.js"></script>
  <style>
    :root { --gold: #ffd700; --dark: #050505; --danger: #ff0f0f; }
    body { background: radial-gradient(circle at 20% 10%, rgba(255,215,0,0.10), transparent 45%),
                   radial-gradient(circle at 80% 30%, rgba(255,215,0,0.06), transparent 45%),
                   var(--dark); }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(18px); }
    input { background: #000; border: 1px solid rgba(255,255,255,0.12); }
    input:focus { outline: none; border-color: rgba(255,215,0,0.75); box-shadow: 0 0 0 4px rgba(255,215,0,0.12); }
  </style>
  <script defer src="/static/js/ui-a11y.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-white">

  <div class="w-full max-w-md glass rounded-[2rem] p-8">
    <div class="flex items-start justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2 mb-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#ffd700] shadow-[0_0_12px_rgba(255,215,0,0.8)]"></span>
          <span class="text-[10px] uppercase tracking-[0.35em] text-gray-300 mono">VIP access</span>
        </div>
        <h1 class="orbitron text-2xl font-black tracking-widest uppercase">Clé VIP</h1>
        <p class="text-[11px] text-gray-400 mt-1 mono">Entrez votre clé temporaire (usage unique).</p>
      </div>
      <button onclick="location.href='/dashboard'" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition text-[10px] mono font-bold">
        <i class="fas fa-th-large mr-2"></i> 🏠 Hub
      </button>
    </div>

    <div id="alert" class="hidden mb-4 rounded-2xl border border-red-500/40 bg-red-500/10 p-4">
      <div class="flex items-start gap-3">
        <div class="mt-0.5 text-red-300">
          <i class="fas fa-triangle-exclamation"></i>
        </div>
        <div>
          <div class="mono text-[11px] font-bold uppercase tracking-widest">Erreur</div>
          <div id="alertText" class="mono text-[11px] text-gray-200 mt-1"></div>
        </div>
      </div>
    </div>

    <form action="/vip-verify" method="POST" class="space-y-4">
      <div>
        <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Clé VIP</label>
        <input
          class="w-full rounded-2xl px-4 py-3 mono text-[12px]"
          type="text"
          name="vip_key"
          placeholder="LABO-VIP..."
          autocomplete="off"
          required
          autofocus
        />
      </div>

      <button type="submit" class="w-full py-3 rounded-2xl bg-[#ffd700] text-black font-black orbitron text-[11px] tracking-widest hover:scale-[1.02] transition shadow-[0_0_18px_rgba(255,215,0,0.30)]">
        VALIDER
      </button>
    </form>

    <div class="mt-6 text-[10px] text-gray-500 mono">
      <a class="hover:text-white transition" href="/dashboard">🏠 Retour dashboard</a>
    </div>
  </div>

  <script>
    (function () {
      const qs = new URLSearchParams(window.location.search);
      const err = (qs.get('err') || '').trim();
      const map = {
        used: 'Cette clé a déjà été utilisée.',
        expired: 'Cette clé a expiré.',
        invalid: 'Clé invalide.'
      };
      if (!err || !map[err]) return;
      const alertBox = document.getElementById('alert');
      const alertText = document.getElementById('alertText');
      if (alertText) alertText.textContent = map[err];
      if (alertBox) alertBox.classList.remove('hidden');
    })();
  </script>
</body>
</html>
