<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/icons/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublie | LABORATOIRE</title>
    <link rel="stylesheet" href="/static/css/tailwind-build.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/command-palette.css">
  <link rel="stylesheet" href="/static/css/a11y.css">
  <script defer src="/static/js/command-palette.js"></script>
  <script defer src="/static/js/ui-a11y.js"></script>
  <style>
    :root { --neon:#39ff14; --cyan:#00e8ff; --ink:#050505; --danger:#ff3b3b; }
    body {
      background:
        radial-gradient(circle at 15% 5%, rgba(57,255,20,0.09), transparent 36%),
        radial-gradient(circle at 82% 15%, rgba(0,232,255,0.10), transparent 42%),
        radial-gradient(circle at 50% 98%, rgba(255,59,59,0.07), transparent 45%),
        var(--ink);
    }
    .orbitron { font-family: "Orbitron", sans-serif; }
    .mono { font-family: "JetBrains Mono", monospace; }
    .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(14px); }
    input { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.16); }
    input:focus { outline: none; border-color: rgba(57,255,20,0.75); box-shadow: 0 0 0 4px rgba(57,255,20,0.12); }
    .password-field { position: relative; }
    .password-field input { padding-right: 3rem; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.85rem;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
    }
    .password-toggle:hover,
    .password-toggle:focus-visible { color: rgba(255,255,255,0.95); outline: none; }
  </style>
</head>
<body class="min-h-screen text-white p-5 md:p-8">
  <main class="mx-auto w-full max-w-3xl">
    <!-- audit-nav -->
    <div data-nav-audit="auth" class="flex flex-wrap items-center gap-3 mb-6 text-[11px] uppercase tracking-widest">
      <a href="/acces" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-arrow-left"></i> Retour
      </a>
      <a href="/" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <i class="fas fa-house"></i> Accueil
      </a>
    </div>
    <header class="glass rounded-3xl p-5 md:p-7 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-300 shadow-[0_0_12px_rgba(253,224,71,0.8)]"></span>
            <span class="mono text-[10px] tracking-[0.35em] uppercase text-gray-300">Recuperation</span>
          </div>
          <h1 class="orbitron text-2xl md:text-3xl font-black tracking-wider uppercase">Mot de passe oublie</h1>
          <p class="mono text-[11px] md:text-xs text-gray-300 mt-2">Vérifie ton identité avec ton contact et ta phrase secrète pour définir un nouveau mot de passe.</p>
        </div>
        <a href="/acces" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-[10px] mono font-bold uppercase tracking-widest">
          <i class="fas fa-arrow-left mr-2"></i>Retour acces
        </a>
      </div>
    </header>

    <div id="alert" class="hidden mb-5 rounded-2xl border p-4">
      <div class="flex items-start gap-3">
        <i id="alertIcon" class="fas fa-circle-info mt-1"></i>
        <div>
          <p id="alertTitle" class="mono text-[11px] font-bold uppercase tracking-widest">Info</p>
          <p id="alertText" class="mono text-[12px] text-gray-100 mt-1"></p>
        </div>
      </div>
    </div>

    <section class="glass rounded-3xl p-5 md:p-7">
      <form action="/acces/mot-de-passe-oublie" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Pseudo</label>
            <input type="text" name="username" minlength="3" maxlength="32" required value="{{ prefill_username }}" placeholder="Ex: Client_VIP" class="w-full rounded-2xl px-4 py-3 mono text-[12px]" />
          </div>
          <div>
            <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Contact</label>
            <input type="text" name="contact" minlength="3" maxlength="160" required value="{{ prefill_contact }}" placeholder="WhatsApp, Telegram, email" class="w-full rounded-2xl px-4 py-3 mono text-[12px]" />
          </div>
        </div>

        <div>
          <label class="block mono text-[10px] text-gray-400 uppercase tracking-widest mb-2">Phrase secrète</label>
          <div class="password-field">
            <input type="password" name="recovery_secret" minlength="4" maxlength="120" required placeholder="La phrase secrète choisie à l'inscription" class="w-full rounded-2xl px-4 py-3 mono text-[12px]" />
            <button type="button" class="password-toggle" data-password-toggle aria-label="Afficher la phrase secrete" aria-pressed="false">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full md:w-auto px-7 py-3 rounded-2xl bg-yellow-300 text-black orbitron text-[11px] tracking-widest font-black uppercase hover:scale-[1.01] transition shadow-[0_0_22px_rgba(253,224,71,0.35)]">
          Réinitialiser mon mot de passe
        </button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        const field = button.closest(".password-field");
        const input = field ? field.querySelector("input") : null;
        const icon = button.querySelector("i");
        if (!input || !icon) return;
        button.addEventListener("click", function () {
          const isHidden = input.type === "password";
          input.type = isHidden ? "text" : "password";
          button.setAttribute("aria-pressed", isHidden ? "true" : "false");
          button.setAttribute("aria-label", isHidden ? "Masquer le champ" : "Afficher le champ");
          icon.className = isHidden ? "fas fa-eye-slash" : "fas fa-eye";
        });
      });

      const qs = new URLSearchParams(window.location.search);
      const err = (qs.get("err") || "").trim().toLowerCase();
      const message = (qs.get("message") || "{{ forgot_message }}").trim();
      const alertBox = document.getElementById("alert");
      const alertTitle = document.getElementById("alertTitle");
      const alertText = document.getElementById("alertText");
      const alertIcon = document.getElementById("alertIcon");

      function showAlert(kind, title, text) {
        if (!alertBox) return;
        alertBox.classList.remove("hidden");
        alertBox.classList.remove("border-red-500/40", "bg-red-500/10", "border-cyan-400/40", "bg-cyan-400/10");
        if (kind === "danger") {
          alertBox.classList.add("border-red-500/40", "bg-red-500/10");
          if (alertIcon) alertIcon.className = "fas fa-triangle-exclamation mt-1 text-red-300";
        } else {
          alertBox.classList.add("border-cyan-400/40", "bg-cyan-400/10");
          if (alertIcon) alertIcon.className = "fas fa-circle-info mt-1 text-cyan-300";
        }
        if (alertTitle) alertTitle.textContent = title;
        if (alertText) alertText.textContent = text;
      }

      if (message && !err) {
        showAlert("info", "Information", message);
        return;
      }
      if (err === "bad_username") {
        showAlert("danger", "Pseudo invalide", "Le pseudo doit faire entre 3 et 32 caractères.");
      } else if (err === "bad_contact") {
        showAlert("danger", "Contact invalide", "Le contact de récupération est obligatoire.");
      } else if (err === "bad_secret") {
        showAlert("danger", "Identité non vérifiée", "Le pseudo, le contact ou la phrase secrète ne correspondent pas.");
      } else if (err === "csrf") {
        showAlert("danger", "Session expirée", "Recharge la page puis recommence.");
      } else if (err === "rate_limit") {
        showAlert("danger", "Trop de tentatives", "Attends un instant avant de recommencer.");
      } else if (err === "expired") {
        showAlert("danger", "Session expirée", "Relance d'abord la vérification de récupération.");
      } else {
        showAlert("info", "Sécurité", "Cette action remplacera immédiatement votre mot de passe actuel.");
      }
    })();
  </script>
</body>
</html>
