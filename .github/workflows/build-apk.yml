name: Build APK Labo Surf

# Se declenche a chaque push sur main ou sur la branche de la phase en cours, ou manuellement depuis l'onglet
# Actions du site GitHub (utilisable depuis le telephone). Produit une APK DEBUG (jamais une release signee).
on:
  push:
    branches: [ main, phase5-vpn-client-integration, phase6-ui-palette, phase7-udp-real ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node (tests JavaScript de l'interface)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests JavaScript (contrat, flux de connexion, traductions)
        run: node --test tests/js/*.test.js

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          # v3 echoue depuis que Google a retire un paquet du SDK (corrige dans la v4) ; versions fixees = build reproductible
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests unitaires Android (moteur UDP, protocole, lien, client contre un faux serveur)
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build.log
          python3 tests/ci/junit_summary.py --fail-if-empty

      - name: Compiler l'APK (debug)
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee -a build.log

      # Si la compilation echoue, les premieres vraies erreurs sont remontees en annotations (lisibles sans telecharger les logs).
      - name: Remonter les erreurs de compilation et de tests
        if: failure()
        run: |
          python3 tests/ci/junit_summary.py || true
          grep -m 25 -E "^e: |error:|What went wrong|Execution failed|FAILURE" -A2 build.log | while IFS= read -r l; do
            l="${l//'%'/'%25'}"
            echo "::error title=Erreur de compilation::${l}"
          done || true

      - name: Verifier l'APK (paquet, version, contenu, composants)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK absente : $APK"; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BT/aapt2"
          "$AAPT2" dump badging "$APK" > badging.txt
          PKG=$(grep -m1 "^package:" badging.txt)
          echo "::notice title=APK::$(stat -c %s "$APK") octets ; sha256 $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "::notice title=Paquet::$PKG"
          echo "::notice title=SDK::$(grep -E "^(minSdkVersion|targetSdkVersion|sdkVersion)" badging.txt | tr '\n' ' ')"
          echo "::notice title=Permissions::$(grep "^uses-permission" badging.txt | sed "s/uses-permission: name=//" | tr '\n' ' ')"
          echo "::notice title=Activite de lancement::$(grep -m1 launchable-activity badging.txt)"
          grep -q "name='com.philippo237.labosurf'" badging.txt
          grep -q "launchable-activity: name='com.philippo237.labosurf.MainActivity'" badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q "com.philippo237.labosurf.LaboVpnService" manifest.txt
          grep -q "android.permission.BIND_VPN_SERVICE" manifest.txt
          echo "::notice title=Manifeste::MainActivity et LaboVpnService (BIND_VPN_SERVICE) presents"
          unzip -l "$APK" > contenu.txt
          for f in assets/www/index.html assets/www/js/contract.js assets/www/js/vpn.js assets/www/js/api.js assets/www/js/lang/fr.js assets/www/js/lang/en.js classes.dex; do
            grep -q " $f\$" contenu.txt || { echo "::error::absent de l'APK : $f"; exit 1; }
          done
          if grep -q "assets/www/preview_" contenu.txt; then echo "::error::anciennes maquettes (faux serveurs/pings) embarquees"; exit 1; fi
          rm -rf dex && mkdir dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          grep -a -q "labosurf/LaboVpnService;" dex/*.dex || { echo "::error::LaboVpnService absent du bytecode"; exit 1; }
          grep -a -q "labosurf/MainActivity;" dex/*.dex || { echo "::error::MainActivity absente du bytecode"; exit 1; }
          echo "::notice title=Contenu::assets WebView (dont contract.js) et classes.dex presents ; aucune ancienne maquette"
          # Debug uniquement : signee avec la cle debug Android, jamais une release
          "$BT/apksigner" verify --print-certs "$APK" | head -3

      - name: Rendre l'APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: labo-surf-vpn-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # Lancement reel sur un emulateur Android 14 : installation, demarrage, WebView, refus propre sans moteur.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: labo-surf-vpn-debug
          path: apk

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test sur emulateur (installation, lancement, connexion UDP contre un faux serveur)
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tests/android/emulator_test.sh apk/app-debug.apk

      - name: Rapport du test emulateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report
          path: |
            emulator-report.txt
            emulator-screen.png
            logcat.txt
            mock-server.log
          if-no-files-found: ignore

      - name: Remonter le resultat du test emulateur
        if: always()
        run: |
          test -f emulator-report.txt || exit 0
          # une seule annotation (GitHub en limite 10 par etape) : sauts de ligne encodes en %0A
          MSG="$(sed -e 's/%/%25/g' emulator-report.txt | awk '{printf "%s%%0A", $0}')"
          if grep -q "^ECHEC" emulator-report.txt; then echo "::error title=Emulateur::${MSG}"; else echo "::notice title=Emulateur::${MSG}"; fi

# ─── Comment recuperer l'APK depuis ton telephone ───
# 1. Va dans l'onglet "Actions" de ton depot GitHub.
# 2. Ouvre le dernier run termine (coche verte).
# 3. Descends jusqu'a "Artifacts" -> "labo-surf-vpn-debug" -> telecharge le zip.
# 4. Dedans se trouve app-debug.apk, installable directement sur ton telephone
#    (autorise "sources inconnues" si Android le demande).
