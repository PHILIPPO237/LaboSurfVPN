<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Factures Officielles — Labo Surf VPN</title>
  <style>
    body{margin:0;background:#060913;color:#F1F5F9;font-family:system-ui,-apple-system,sans-serif;padding-bottom:40px;}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(6,9,19,0.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(245,158,11,0.35);}
    .card{margin:12px;padding:16px;border-radius:18px;background:rgba(12,20,36,0.82);border:1.5px solid rgba(245,158,11,0.45);}
    .stamp{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid #10B981;color:#10B981;font-size:10px;font-weight:800;}
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" style="color:#F59E0B;text-decoration:none;font-weight:800;">← Retour</a>
    <img src="img/logos/logo-horizontal-dark.png" alt="LABOSURF" style="height:24px;">
    <span class="stamp">CERTIFIÉ</span>
  </header>

  <div id="invBox"></div>

  <script>
    fetch((window.FREE_SURF_API_BASE || '') + '/api/user/invoices').then(r => r.json()).then(d => {
      document.getElementById('invBox').innerHTML = (d.invoices || []).map(i => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#FBBF24;">${i.invoice_no || 'INV'}</strong><span class="stamp">PAYÉ & CERTIFIÉ</span></div>
          <div style="font-size:13px;margin-top:6px;">${i.plan_label || 'Pass VIP'} · ${i.amount_xaf || 0} XAF</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:4px;">Token : <code>${i.token_code || '-'}</code></div>
        </div>`).join('') || '<div class="card" style="color:#94A3B8;">Aucune facture enregistrée.</div>';
    }).catch(() => {});
  </script>
</body>
</html>
