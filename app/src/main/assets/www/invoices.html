<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Factures Officielles — Labo Surf VPN</title>
  <style>
    body{margin:0;background:#060913;color:#F1F5F9;font-family:system-ui,-apple-system,sans-serif;padding-bottom:40px;}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(6,9,19,0.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(245,158,11,0.35);}
    .card{margin:12px;padding:16px;border-radius:18px;background:rgba(12,20,36,0.82);border:1.5px solid rgba(245,158,11,0.45);}
    .stamp{display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid #10B981;color:#10B981;font-size:10px;font-weight:800;}
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" style="color:#F59E0B;text-decoration:none;font-weight:800;">← Retour</a>
    <img src="img/logos/logo-horizontal-dark.png" alt="LABOSURF" style="height:24px;">
    <span class="stamp">CERTIFIÉ</span>
  </header>

  <div id="invBox"></div>

  <script>
    const API = window.FREE_SURF_API_BASE || sessionStorage.getItem('ls_bridge_api') || 'https://laboratoire.free-surf237-4all.xyz';
    const TOKEN = sessionStorage.getItem('ls_bridge_token') || '';
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch(API + '/api/user/invoices', { cache: 'no-store', headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} })
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(d => {
        document.getElementById('invBox').innerHTML = (d.invoices || []).map(i => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#FBBF24;">${esc(i.invoice_no || 'INV')}</strong><span class="stamp">PAYÉ &amp; CERTIFIÉ</span></div>
            <div style="font-size:13px;margin-top:6px;">${esc(i.plan_label || 'Pass VIP')} · ${esc(i.amount_xaf == null ? '—' : i.amount_xaf)} XAF</div>
            <div style="font-size:11px;color:#94A3B8;margin-top:4px;">Token : <code>${esc(i.token_code || '—')}</code></div>
          </div>`).join('') || '<div class="card" style="color:#94A3B8;">Aucune facture enregistrée pour ce compte.</div>';
      }).catch(() => {
        document.getElementById('invBox').innerHTML = '<div class="card" style="color:#94A3B8;">Factures momentanément indisponibles. Ouvrez l’application et vérifiez votre session.</div>';
      });
  </script>
</body>
</html>
