<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Services & Serveurs — Labo Surf VPN</title>
  <style>
    body{margin:0;background:#060913;color:#F1F5F9;font-family:system-ui,-apple-system,sans-serif;padding-bottom:40px;}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(6,9,19,0.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(16,185,129,0.28);}
    .card{margin:12px;padding:15px;border-radius:18px;background:rgba(12,20,36,0.78);backdrop-filter:blur(16px);border:1px solid rgba(16,185,129,0.32);}
    .btn{width:100%;margin-top:8px;padding:9px;border-radius:10px;background:#10B981;color:#060913;font-weight:800;border:none;cursor:pointer;}
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" style="color:#10B981;text-decoration:none;font-weight:800;">← Retour</a>
    <strong>🌍 Services de mon Pays</strong>
    <span id="ccFlag">🇨🇲</span>
  </header>

  <div id="srvList" style="padding-top:4px;"></div>

  <script>
    fetch((window.FREE_SURF_API_BASE || '') + '/api/client/services-catalog').then(r => r.json()).then(d => {
      if (d.country && d.country.flag) document.getElementById('ccFlag').textContent = d.country.flag;
      document.getElementById('srvList').innerHTML = (d.services || []).map(s => `
        <div class="card" style="border-color:${s.locked_vip ? 'rgba(245,158,11,0.5)' : 'rgba(16,185,129,0.4)'};">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${s.country_flag} ${s.commercial_name}</strong>
            <span style="font-size:11px;color:${s.locked_vip ? '#FBBF24' : '#10B981'};">${s.locked_vip ? '👑 VIP' : '🟢 Gratuit'}</span>
          </div>
          <div style="font-size:12px;color:#94A3B8;margin-top:4px;">Opérateur : ${(s.operators || []).join(', ')}</div>
          ${s.locked_vip
            ? '<button class="btn" style="background:rgba(245,158,11,0.2);color:#FBBF24;border:1px solid #F59E0B;" onclick="location.href=\'upgrade.html\'">🔒 Débloquer avec Pass VIP</button>'
            : '<button class="btn" onclick="location.href=\'index.html\'">Utiliser sur l\'accueil</button>'}
        </div>`).join('') || '<div class="card">Chargement du catalogue...</div>';
    }).catch(() => {
      document.getElementById('srvList').innerHTML = '<div class="card">Camtel UDP Pro Stable · Camtel Hysteria2 Ultra · Camtel Hybride · Airtel DNSTT + Xray Pro</div>';
    });
  </script>
</body>
</html>
